<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>설비 설치 도우미</title>
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#d1d5db;
  --pri:#1d4ed8; --pri-soft:#dbeafe; --ok:#15803d; --ok-soft:#dcfce7;
  --ng:#b91c1c; --ng-soft:#fee2e2; --warn:#b45309; --warn-soft:#fef3c7;
  --hl:#ea580c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;font-weight:700}
.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#374151;white-space:nowrap}
.pill.ok{background:#166534}
main{padding:12px 12px 150px;max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#fff;border-top:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:15px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:18px;margin:0 0 8px}
.card h3{font-size:16px;margin:12px 0 6px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;min-width:92px;text-align:left;flex:none}
.chip b{display:block;font-size:17px}
.chip span{font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--pri);background:var(--pri-soft)}
.chip.done{border-color:var(--ok)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--pri);color:#fff;min-height:50px}
.btn.sec{background:#e5e7eb;color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn.ng{background:var(--ng)}
.btn.sm{padding:8px 12px;min-height:40px;font-size:15px}
.btn:disabled{opacity:.4}
.stepnav{position:fixed;left:0;right:0;bottom:56px;z-index:5;background:rgba(243,244,246,.97);padding:8px 12px;border-top:1px solid var(--line)}
.stepnav .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.stepnav .btn{flex:1}
.prog{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--pri)}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.dots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;padding:0}
.dots button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.dots button.ok{border-color:var(--ok);color:var(--ok)}
.dots button.ng{border-color:var(--ng);color:var(--ng)}
.dots button.on.ok,.dots button.on.ng{color:#fff}
.how{margin:6px 0 0;padding-left:20px}
.how li{margin:4px 0;line-height:1.45}
svg.dia{width:100%;height:auto;background:#fafafa;border:1px solid var(--line);border-radius:10px}
.field{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.field .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.field .lbl{font-weight:700}
.tape{font-size:34px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.tape small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.inputs label{font-size:13px;color:var(--muted)}
.inputs input{width:100%;font-size:22px;font-weight:700;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff}
.inputs input:focus{outline:none;border-color:var(--pri)}
.res{margin-top:8px;padding:8px 10px;border-radius:10px;font-weight:700;font-size:15px}
.res.ok{background:var(--ok-soft);color:var(--ok)}
.res.ng{background:var(--ng-soft);color:var(--ng)}
.res.warn{background:var(--warn-soft);color:var(--warn)}
.res.info{background:#f3f4f6;color:var(--muted)}
.banner{padding:12px;border-radius:12px;margin-top:10px;font-weight:700;line-height:1.5}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.ng{background:var(--ng-soft);color:var(--ng)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.chk{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer}
.chk input{width:26px;height:26px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label,.f label{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
.grid2 input,.f input,.f textarea,.f select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:17px;background:#fff}
.f{margin-top:8px}
.grid2 select,.f select,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
.top input:not([type=checkbox]){width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px;font-weight:700}
.seg button.on{background:var(--pri);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #e5e7eb;padding:6px 4px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
td.ok{color:var(--ok);font-weight:700}
td.ng{color:var(--ng);font-weight:700}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ph{border:2px dashed var(--line);border-radius:12px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;text-align:center;font-size:14px;color:var(--muted);padding:6px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px}
.ph input{position:absolute;inset:0;opacity:0}
.calc .out{font-size:26px;font-weight:800;margin-top:6px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%}
.modal .row{justify-content:flex-end;margin-top:14px}
.hide{display:none!important}
.frow{display:grid;grid-template-columns:1.15fr 1.25fr .7fr auto;gap:6px;margin-top:6px;align-items:center}
.frow.hd{font-size:12px;color:var(--muted);margin-top:10px}
.frow select,.frow input{width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;min-width:0}
.frow .memo{grid-column:1 / -1;font-size:14px;padding:7px 8px;color:#374151}
.lvgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:start;margin-top:8px}
.lvgrid .hd{font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.lvgrid .no{font-weight:800;padding-top:12px;font-size:15px}
.lvgrid input{width:100%;font-size:20px;font-weight:700;padding:9px;border:2px solid var(--line);border-radius:10px;background:#fff}
.lvgrid input:focus{outline:none;border-color:var(--pri)}
.adj{font-size:13px;font-weight:700;margin-top:3px;text-align:center;min-height:17px}
.adj.up{color:#1d4ed8}.adj.dn{color:#b45309}.adj.z{color:var(--ok)}
.rounds{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rounds button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
.rounds button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.kpi div{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi .ok b{color:var(--ok)}.kpi .ng b{color:var(--ng)}
details.card summary{font-weight:700;font-size:17px;cursor:pointer}
ol.order{padding-left:20px;margin:6px 0}ol.order li{margin:3px 0}
</style>
</head>
<body>
<header>
  <h1>설비 설치 도우미</h1>
  <span id="sync" class="pill">이 기기에 저장</span>
</header>
<main id="main"></main>
<div id="stepnav" class="stepnav hide"><div class="in">
  <button class="btn sec" id="prevBtn">이전</button>
  <button class="btn" id="nextBtn">다음</button>
</div></div>
<nav class="tabs" id="tabs">
  <button data-tab="work" class="on">작업</button>
  <button data-tab="est">견적</button>
  <button data-tab="setup">설비</button>
  <button data-tab="record">기록</button>
  <button data-tab="calc">계산</button>
</nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box">
  <div id="modalMsg"></div>
  <div class="row"><button class="btn sec sm" id="modalNo">취소</button><button class="btn ng sm" id="modalYes">확인</button></div>
</div></div>

<script>
(function(){
'use strict';

/* ---------- 기본 데이터 ---------- */
var LS_KEY = 'linemark-v1';
var LS_PHOTO = 'linemark-photos-v1';

function defaultUnit(name, note, sched){
  return {id: 'u' + Math.random().toString(36).slice(2,8), name:name, note:note||'', sched:sched||'',
    L:7430, W:1462, X:500, Y:null, P1:null, P2:null, ports:'',
    meas:{}, checks:{}, worker:'', checker:'', done:null};
}
function defaultState(){
  return {
    v:1, savedAt:0,
    settings:{offset:100, tolOuter:3, tolDiag:5, worker:'', presets:[{name:'N2 Stocker', L:7430, W:1462}]},
    units:[
      defaultUnit('#117','14열 7단','11/11~01/19'),
      defaultUnit('#115','14열 7단','11/04~01/12'),
      defaultUnit('#116','14열 7단','11/04~01/12')
    ],
    cur:{unit:0, step:0}, tab:'work'
  };
}

var state = loadLocal() || defaultState();
var photos = loadPhotos();
if(state.tab === 'level') state.tab = 'work';
state.units.forEach(function(u){ if(u.lev && u.lev.checks){ ['lk1','lk2','lk3'].forEach(function(k){ if(u.lev.checks[k]) u.checks[k] = true; }); } });
if(!state.settings.presets) state.settings.presets = [{name:'N2 Stocker', L:7430, W:1462}];

function loadLocal(){
  try{ var s = localStorage.getItem(LS_KEY); if(s){ var o = JSON.parse(s); if(o && o.units) return o; } }catch(e){}
  return null;
}
function loadPhotos(){
  try{ var s = localStorage.getItem(LS_PHOTO); if(s) return JSON.parse(s) || {}; }catch(e){}
  return {};
}
function savePhotos(){
  try{ localStorage.setItem(LS_PHOTO, JSON.stringify(photos)); return true; }
  catch(e){ toast('사진 저장 공간이 부족합니다. 기록 탭에서 오래된 사진을 지워 주세요.'); return false; }
}

/* ---------- 저장 (로컬 + 클라우드) ---------- */
var dbRef = null, saveTimer = null, writing = false, pendingWrite = false;
function save(){
  state.savedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  if(dbRef){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushCloud, 1500);
    setSync('동기화 중…', false);
  }
}
function pushCloud(){
  if(!dbRef) return;
  if(writing){ pendingWrite = true; return; }
  writing = true;
  var body = JSON.parse(JSON.stringify(state));
  dbRef.set(body).then(function(){
    setSync('클라우드 저장됨', true);
  }).catch(function(e){
    if(e && e.code === 'quota_exceeded') toast('클라우드 저장 공간이 가득 찼습니다.');
    setSync('이 기기에 저장', false);
  }).then(function(){
    writing = false;
    if(pendingWrite){ pendingWrite = false; pushCloud(); }
  });
}
function setSync(t, ok){ var el = document.getElementById('sync'); el.textContent = t; el.className = 'pill' + (ok ? ' ok' : ''); }

function initCloud(){
  if(!window.claude || !window.claude.use) return;
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
    var db = r[0], user = r[1];
    if(!db || !user) return null;
    return user.id().then(function(uid){
      if(!uid) return null;
      var ref = db.doc('data/users/' + uid + '/linemark');
      var timer = setTimeout(function(){ setSync('이 기기에 저장', false); }, 10000);
      return ref.get().then(function(snap){
        clearTimeout(timer);
        dbRef = ref;
        if(snap.exists){
          var d = snap.data();
          if(d && d.units && (d.savedAt||0) > (state.savedAt||0)){
            state = JSON.parse(JSON.stringify(d));
            try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
            render();
            toast('다른 기기에서 저장한 기록을 불러왔습니다.');
          } else if((state.savedAt||0) > (d && d.savedAt || 0)) { pushCloud(); }
          setSync('클라우드 저장됨', true);
        } else {
          pushCloud();
        }
      }).catch(function(){ clearTimeout(timer); });
    });
  }).catch(function(){});
}

/* ---------- 계산 ---------- */
function num(v){ if(v === '' || v === null || v === undefined) return null; var n = Number(v); return isFinite(n) ? n : null; }
function fmt(n, d){ if(n === null || n === undefined || !isFinite(n)) return '—'; d = d===undefined?1:d; var r = Math.round(n*Math.pow(10,d))/Math.pow(10,d); return r.toLocaleString('ko-KR',{maximumFractionDigits:d}); }
function sgn(n){ return (n>0?'+':'') + fmt(n); }
function diag(L, W){ return Math.sqrt(L*L + W*W); }
/* 대각선 차이 → 뒷변 이동량: Δ ≈ 2·L·s/D  →  s = Δ·D/(2L) */
function corr(ac, bd, L, W){
  var D = diag(L, W), d = ac - bd;
  return {diff:d, move: Math.abs(d) * D / (2*L), dir: d > 0 ? 'HP' : (d < 0 ? 'OP' : '')};
}
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* 직각 삼각형 3:4:5 — 설비 크기에 맞춰 자동 선택 */
function tri(u){
  var ks = [300,250,200,150,100,50,25], k = 25;
  for(var i=0;i<ks.length;i++){ if(3*ks[i] <= u.W*0.95 && 4*ks[i] <= u.L*0.5){ k = ks[i]; break; } }
  return {k:k, a:3*k, b:4*k, c:5*k};
}
function sizeOk(u){ return u.L > 0 && u.W > 0; }

/* ---------- 작업 단계 ---------- */
function steps(u){
  var S = state.settings, D = diag(u.L, u.W), tr = tri(u);
  return [
    {key:'A', title:'시작점 A 잡기', hl:['refX','refY','X','Y','A'],
     how:['A = 본체 외곽의 HP측·전면(포트측) 모서리. 커버 끝이 아님.',
          '고정자: 기준선 X에 줄자 기점을 대고 "기점 OK".',
          '측정자: 아래 눈금에 십자(+) 표시. 기준선 Y도 같은 방법.',
          '앞 호기에서 이어 재지 말 것. 이 단계는 연필·임시 표시만.'],
     fields:[{k:'AX', label:'A점 X (기준선 X → A)', target:u.X},
             {k:'AY', label:'A점 Y (기준선 Y → A)', target:u.Y}]},
    {key:'B', title:'B점 (앞 장변)', hl:['A','B','AB'],
     how:['A에서 길이 방향으로 줄자를 펴고 아래 눈금에 B 표시.',
          '줄자는 팽팽하게, 바닥에 붙여서.',
          'B점의 Y값도 A와 같아야 앞 장변이 기준선과 평행.'],
     fields:[{k:'AB', label:'A → B', target:u.L},
             {k:'BY', label:'B점 Y (A와 같아야 함)', target:u.Y}]},
    {key:'SQ', title:'직각 잡기 ('+tr.a+'·'+tr.b+'·'+tr.c+')', hl:['A','E','F','EF'],
     how:['A에서 장변 방향 '+tr.b+' 지점에 E 표시.',
          'A에서 폭 방향 약 '+tr.a+' 지점에 F를 잡는다.',
          'E–F가 정확히 '+tr.c+'이 될 때까지 F를 좌우로 옮긴다.',
          'A→F 방향이 폭 방향. 빗변 1mm 오차 = 폭 끝에서 약 '+fmt(u.W*tr.c/(tr.a*tr.b))+'mm 틀어짐.'],
     fields:[{k:'EF', label:'E – F 빗변', target:tr.c, tol:1}]},
    {key:'DC', title:'D점·C점 (뒷변)', hl:['A','B','C','D','AD','BC','DC'],
     how:['A → F 연장선으로 폭만큼 = D.',
          'B에서도 같은 방법으로 직각을 잡고 폭만큼 = C.',
          'D–C 길이가 앞 장변과 같은지 확인.'],
     fields:[{k:'AD', label:'A → D (HP측 폭)', target:u.W},
             {k:'BC', label:'B → C (OP측 폭)', target:u.W},
             {k:'DC', label:'D → C (뒷 장변)', target:u.L}]},
    {key:'DG', title:'대각선 판정', hl:['AC','BD','A','B','C','D'], diag:true,
     how:['A–C, B–D를 각각 잰다. 기준 ' + fmt(D) + ' mm.',
          '두 값의 차이가 허용 ' + S.tolDiag + ' mm 이내면 통과.',
          '통과하기 전에는 초크라인·확정 테이프를 치지 않는다.'],
     fields:[{k:'AC', label:'대각선 A – C', target:D, nj:true},
             {k:'BD', label:'대각선 B – D', target:D, nj:true}]},
    {key:'LN', title:'확정선 치기', hl:['AB','BC','DC','AD'],
     how:['대각선 판정 통과를 확인한 뒤에만 진행.', '4변 초크라인 → 확정색 테이프.'],
     checks:[{k:'ln1', t:'대각선 판정 통과 확인'},{k:'ln2', t:'초크라인 4변 완료'},{k:'ln3', t:'확정색 테이프 부착'}]},
    {key:'MD', title:'모듈 경계 P1·P2', hl:['P1','P2','A','D'],
     how:['앞 장변: A에서 P1·P2를 각각 잰다 (P1에서 이어 재지 않음).',
          '뒷 장변: D에서 같은 값으로 잰다.',
          '앞뒤 두 점을 연결해 경계선. 한쪽만 찍고 직각자로 긋지 않는다.'],
     fields:[{k:'P1F', label:'P1 앞 (A에서)', target:u.P1},{k:'P1R', label:'P1 뒤 (D에서)', target:u.P1},
             {k:'P2F', label:'P2 앞 (A에서)', target:u.P2},{k:'P2R', label:'P2 뒤 (D에서)', target:u.P2}]},
    {key:'PT', title:'하부 포트·지지부', hl:['ports'],
     how:['설비 탭에 입력한 포트 위치를 A 기준으로 표시.', '호기마다 위치가 다를 수 있음 — 3대 같다고 가정하지 않는다.'],

     checks:[{k:'lk1', t:'락너트 전부 체결'},{k:'lk2', t:'체결 후 재측정 — 레벨 OK 유지'},{k:'lk3', t:'앵커·고정 (해당 시)'}]},

var PHASES = [{id:'mark', t:'라인마킹'},{id:'pos', t:'위치 맞춤'},{id:'level', t:'레벨링'},{id:'done', t:'완료'}];
function phaseOf(st){ return st.phase || 'mark'; }

/* 판정 */
function fieldResult(u, f){
  var m = u.meas[f.k] || {};
  var a1 = num(m.a1), a2 = num(m.a2);
  var v = a2 !== null ? a2 : a1;
  var tol = f.tol !== undefined ? f.tol : state.settings.tolOuter;
  var r = {v:v, a1:a1, a2:a2, tol:tol, target:num(f.target)};
  if(v === null){ r.st = 'empty'; return r; }
  if(r.target === null){ r.st = 'info'; return r; }
  r.dev = v - r.target;
  if(f.nj){ r.st = 'info'; r.nj = true; return r; }
  r.st = Math.abs(r.dev) <= tol + 1e-9 ? 'ok' : 'ng';
  if(a1 !== null && a2 !== null && Math.abs(a1 - a2) > 1) r.redo = true;
  return r;
}
function diagResult(u){
  var m1 = fieldResult(u, {k:'AC', target:diag(u.L,u.W)}), m2 = fieldResult(u, {k:'BD', target:diag(u.L,u.W)});
  if(m1.v === null || m2.v === null) return null;
  var c = corr(m1.v, m2.v, u.L, u.W);
  c.ok = Math.abs(c.diff) <= state.settings.tolDiag + 1e-9;
  return c;
}
function levLast(u){
  if(!u.lev) return null;
  var r = null; u.lev.rounds.forEach(function(rd){ var x = levCalc(u, rd); if(x) r = x; });
  return r;
}
function stepStatus(u, st){
  if(st.level){ var lr = levLast(u); if(!lr) return ''; if(lr.ok) return 'ok'; return lr.count < lr.total ? 'part' : 'ng'; }
  if(st.fields && st.checks){
    var fs = stepStatus(u, {fields:st.fields}), cs = stepStatus(u, {checks:st.checks});
    if(fs === 'ng') return 'ng';
    if(fs === 'ok' && cs === 'ok') return 'ok';
    return (fs || cs) ? 'part' : '';
  }
  if(st.fields){
    var any = false, ng = false, all = true;
    st.fields.forEach(function(f){ var r = fieldResult(u, f); if(r.st !== 'empty') any = true; else all = false; if(r.st === 'ng') ng = true; });
    if(st.diag){ var d = diagResult(u); if(d && !d.ok) ng = true; }
    if(ng) return 'ng';
    if(any && all) return 'ok';
    return any ? 'part' : '';
  }
  if(st.checks){
    var n = st.checks.filter(function(c){ return u.checks[c.k]; }).length;
    return n === st.checks.length ? 'ok' : (n ? 'part' : '');
  }
  if(st.photo){
    var p = photos[u.id] || {}; var n2 = st.slots.filter(function(s,i){ return p[i]; }).length;
    return n2 === st.slots.length ? 'ok' : (n2 ? 'part' : '');
  }
  if(st.done) return u.done ? 'ok' : '';
  return '';
}
function unitProgress(u){
  var ss = steps(u), ok = 0, ng = 0;
  ss.forEach(function(s){ var t = stepStatus(u, s); if(t === 'ok') ok++; if(t === 'ng') ng++; });
  return {ok:ok, ng:ng, total:ss.length};
}

/* ---------- 도면 그림 ---------- */
function diagram(u, hl){
  var H = {}; (hl||[]).forEach(function(k){ H[k] = 1; });
  var all = H.all;
  function on(k){ return all || H[k]; }
  var x0 = 70, x1 = 330, y0 = 54, sc = (x1 - x0) / u.L, h = u.W * sc, y1 = y0 + h;
  var p1 = num(u.P1), p2 = num(u.P2);
  var xp1 = x0 + (p1 !== null ? p1 : u.L/3) * sc, xp2 = x0 + (p2 !== null ? p2 : u.L*2/3) * sc;
  var tr = tri(u), ex = x0 + tr.b * sc, fy = y1 - tr.a * sc;
  var gray = '#9ca3af', hc = 'var(--hl)';
  function ln(a,b,c,d,k,dash){ var c2 = on(k) ? hc : gray, w = on(k) ? 3 : 1.4; return '<line x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'" stroke="'+c2+'" stroke-width="'+w+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>'; }
  function pt(x,y,k,lab,dx,dy){ var c2 = on(k) ? hc : '#374151'; return '<circle cx="'+x+'" cy="'+y+'" r="'+(on(k)?5:3.5)+'" fill="'+c2+'"/><text x="'+(x+dx)+'" y="'+(y+dy)+'" font-size="14" font-weight="700" fill="'+c2+'">'+lab+'</text>'; }
  var s = '<svg class="dia" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">';
  s += '<rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+h+'" fill="#eff6ff" stroke="none"/>';
  s += ln(30,16,30,194,'refX') + '<text x="34" y="26" font-size="11" fill="'+(on('refX')?hc:gray)+'">기준선 X</text>';
  s += ln(14,180,350,180,'refY') + '<text x="346" y="174" font-size="11" text-anchor="end" fill="'+(on('refY')?hc:gray)+'">기준선 Y</text>';
  s += ln(30,y1-24,x0,y1-24,'X','4 3') + '<text x="'+((30+x0)/2)+'" y="'+(y1-28)+'" font-size="11" text-anchor="middle" fill="'+(on('X')?hc:gray)+'">X</text>';
  s += ln(x0-26,y1,x0-26,180,'Y','4 3') + '<text x="'+(x0-30)+'" y="'+((y1+180)/2+4)+'" font-size="11" text-anchor="end" fill="'+(on('Y')?hc:gray)+'">Y</text>';
  s += ln(x0,y1,x1,y1,'AB') + ln(x1,y1,x1,y0,'BC') + ln(x1,y0,x0,y0,'DC') + ln(x0,y0,x0,y1,'AD');
  s += ln(x0,y1,x1,y0,'AC','6 4') + ln(x1,y1,x0,y0,'BD','6 4');
  s += ln(xp1,y0,xp1,y1,'P1','3 3') + ln(xp2,y0,xp2,y1,'P2','3 3');
  s += '<text x="'+(xp1+3)+'" y="'+(y0+14)+'" font-size="11" fill="'+(on('P1')?hc:gray)+'">P1</text><text x="'+(xp2+3)+'" y="'+(y0+14)+'" font-size="11" fill="'+(on('P2')?hc:gray)+'">P2</text>';
  if(on('EF') || on('E')){
    s += ln(x0,y1,ex,y1,'E') + ln(x0,y1,x0,fy,'F') + ln(ex,y1,x0,fy,'EF');
    s += pt(ex,y1,'E','E',-4,16) + pt(x0,fy,'F','F',-16,4);
  }
  if(on('ports')){
    s += '<rect x="'+(x0+14)+'" y="'+y1+'" width="34" height="18" fill="none" stroke="'+hc+'" stroke-width="2"/><rect x="'+(x1-58)+'" y="'+y1+'" width="34" height="18" fill="none" stroke="'+hc+'" stroke-width="2"/>';
  }
  if(on('arrow')){
    s += '<line x1="'+(x0+90)+'" y1="'+((y0+y1)/2)+'" x2="'+(x1-90)+'" y2="'+((y0+y1)/2)+'" stroke="'+hc+'" stroke-width="3"/><path d="M'+(x1-90)+' '+((y0+y1)/2-6)+' L'+(x1-78)+' '+((y0+y1)/2)+' L'+(x1-90)+' '+((y0+y1)/2+6)+'z" fill="'+hc+'"/>';
  }
  s += '<text x="'+(x0+6)+'" y="'+((y0+y1)/2+4)+'" font-size="11" fill="#6b7280">HP</text><text x="'+(x1-6)+'" y="'+((y0+y1)/2+4)+'" font-size="11" fill="#6b7280" text-anchor="end">OP</text>';
  s += pt(x0,y1,'A','A',-14,16) + pt(x1,y1,'B','B',6,16) + pt(x1,y0,'C','C',6,-4) + pt(x0,y0,'D','D',-14,-4);
  s += '<text x="'+((x0+x1)/2)+'" y="'+(y1+30)+'" font-size="12" text-anchor="middle" fill="#374151">'+fmt(u.L,0)+' × '+fmt(u.W,0)+' · 대각선 '+fmt(diag(u.L,u.W))+'</text>';
  s += '</svg>';
  return s;
}

/* ---------- 렌더 ---------- */
var main = document.getElementById('main');
function render(){
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === state.tab); });

  if(state.cur.unit >= state.units.length) state.cur.unit = 0;
  if(state.tab === 'work') renderWork();

  else if(state.tab === 'setup') renderSetup();
  else if(state.tab === 'record') renderRecord();

}

function unitChips(){
  return '<div class="chips">' + state.units.map(function(u, i){
    var p = unitProgress(u);
    return '<button class="chip'+(i===state.cur.unit?' on':'')+(u.done?' done':'')+'" data-unit="'+i+'"><b>'+esc(u.name)+'</b><span>'+(u.done?'완료':p.ok+'/'+p.total+' 단계')+(p.ng?' · NG '+p.ng:'')+'</span></button>';
  }).join('') + '</div>';
}

function renderWork(){

  h += '<div class="seg" style="margin-bottom:10px">' + PHASES.map(function(ph){
    var idx = ss.map(function(x, i){ return phaseOf(x) === ph.id ? i : -1; }).filter(function(i){ return i >= 0; });
    var sts = idx.map(function(i){ return stepStatus(u, ss[i]); });
    var okN = sts.filter(function(x){ return x === 'ok'; }).length, ngN = sts.filter(function(x){ return x === 'ng'; }).length;

  }).join('') + '</div>';
  h += '<div class="card"><div class="dots">' + ss.map(function(s, i){
    var t = stepStatus(u, s);
    return '<button data-step="'+i+'" class="'+(i===state.cur.step?'on ':'')+(t==='ok'?'ok':t==='ng'?'ng':'')+'">'+(i+1)+'</button>';

  h += '<div class="muted">'+esc(u.name)+' · '+(state.cur.step+1)+' / '+ss.length+' 단계</div>';

  h += '<div class="prog"><i style="width:'+((state.cur.step+1)/ss.length*100)+'%"></i></div>';

      if(tgt !== null && !f.raw) h += '<button class="btn sec sm" data-say="'+(Math.round((tgt+off)*10)/10)+'">읽어주기</button>';
      h += '</div>';
      if(tgt !== null && !f.raw) h += '<div class="tape">'+fmt(tgt+off)+'<small>줄자 눈금'+(off?' ('+off+' 기점)':'')+'</small></div>';
      var itype = f.raw ? 'type="number" step="any" ' : '';

      h += '<div><label>2차 (역할 교대)</label><input '+itype+'inputmode="decimal" data-k="'+f.k+'" data-n="a2" value="'+(m.a2!==null&&m.a2!==undefined?(m.a2+off):'')+'"></div></div>';
      h += '<div class="res '+resClass(r)+'" id="res-'+f.k+'">'+resText(r)+'</div></div>';

    });

  if(st.photo){
    var p = photos[u.id] || {};

      return '<label class="ph">'+(p[i]?'<img src="'+p[i]+'" alt=""><span class="cap">'+esc(sl)+'</span>':'<b>+</b><span>'+esc(sl)+'</span>')+'<input type="file" accept="image/*" capture="environment" data-photo="'+i+'"></label>';
    }).join('') + '</div><div class="muted" style="margin-top:6px">사진은 이 휴대폰에만 저장됩니다.</div>';
  }
  if(st.done){

    h += '<h3>레벨링</h3>' + levSummary(u);
    h += '<div class="grid2" style="margin-top:10px"><div><label>작업자</label><input data-u="worker" value="'+esc(u.worker||S.worker||'')+'"></div><div><label>확인자</label><input data-u="checker" value="'+esc(u.checker||'')+'"></div></div>';
    var pr = unitProgress(u);

function setSize(u, k, v){

function resClass(r){ return r.st === 'empty' ? 'info' : r.st === 'info' ? 'info' : (r.redo ? 'warn' : r.st); }
function resText(r){

/* ---------- 레벨링 ---------- */
function ensureLev(u){
  if(!u.lev) u.lev = {n:4, xs:'', pitch:2.5, ref:'max', setH:null, kind:'h', tolFlat:0.5, tolTilt:0.1, rounds:[{at:'', v:{}}], ri:0, checks:{}};
  if(!u.lev.rounds || !u.lev.rounds.length) u.lev.rounds = [{at:'', v:{}}];
  if(u.lev.ri >= u.lev.rounds.length) u.lev.ri = u.lev.rounds.length - 1;
  if(!u.lev.checks) u.lev.checks = {};
  return u.lev;
}
function levX(u){
  var L = ensureLev(u), n = L.n;
  var xs = String(L.xs||'').split(/[,\s]+/).map(num).filter(function(x){ return x !== null; });
  if(xs.length === n) return xs;
  var a = []; for(var i=0;i<n;i++) a.push(n === 1 ? u.L/2 : u.L*i/(n-1));
  return a;
}
function levKeys(u){ var n = ensureLev(u).n, k = []; for(var i=0;i<n;i++){ k.push('F'+i); k.push('R'+i); } return k; }
function footName(k){ return (k[0]==='F'?'앞':'뒤') + (+k.slice(1)+1); }
function levCalc(u, round){
  var L = ensureLev(u), xs = levX(u), pts = [];
  for(var i=0;i<L.n;i++){
    ['F','R'].forEach(function(sd){
      var v = num(round.v[sd+i]);
      if(v !== null) pts.push({k:sd+i, x:xs[i], y: sd==='F'?0:u.W, h: L.kind==='h' ? v : -v});
    });
  }
  if(!pts.length) return null;
  var hs = pts.map(function(p){ return p.h; });
  var mx = Math.max.apply(null, hs), mn = Math.min.apply(null, hs), avg = hs.reduce(function(a,b){return a+b;},0)/hs.length;
  var T = L.ref === 'avg' ? avg : L.ref === 'set' && num(L.setH) !== null ? (L.kind==='h' ? num(L.setH) : -num(L.setH)) : mx;
  var adj = {}; pts.forEach(function(p){ adj[p.k] = T - p.h; });
  var r = {pts:pts, T:T, adj:adj, flat:mx-mn, count:pts.length, total:L.n*2};
  /* 최소제곱 평면 h = a + b·x + c·y  →  기울기 b, c (mm/mm) */
  if(pts.length >= 3){
    var S = [[0,0,0],[0,0,0],[0,0,0]], B = [0,0,0];
    pts.forEach(function(p){ var row = [1, p.x, p.y]; for(var i=0;i<3;i++){ for(var j=0;j<3;j++) S[i][j] += row[i]*row[j]; B[i] += row[i]*p.h; } });
    var det = function(M){ return M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1]) - M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0]) + M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]); };
    var d = det(S);
    if(Math.abs(d) > 1e-6){
      var col = function(c){ return S.map(function(row, i){ return row.map(function(v, j){ return j===c ? B[i] : v; }); }); };
      r.tx = det(col(1))/d*1000; r.ty = det(col(2))/d*1000;
    }
  }
  r.flatOk = r.flat <= L.tolFlat + 1e-9;
  r.tiltOk = r.tx === undefined ? null : (Math.abs(r.tx) <= L.tolTilt + 1e-9 && Math.abs(r.ty) <= L.tolTilt + 1e-9);
  r.ok = r.count === r.total && r.flatOk && r.tiltOk !== false;
  return r;
}
function turnsText(a, pitch){
  if(!pitch) return '';
  var t = Math.abs(a)/pitch;
  return fmt(t,2)+'회전 (≈'+Math.round(t*360)+'°)';
}
function adjCls(a, tol){ return Math.abs(a) <= Math.max(0.005, tol*0.1) ? 'z' : (a > 0 ? 'up' : 'dn'); }
function adjText(a, L){
  if(Math.abs(a) <= Math.max(0.005, L.tolFlat*0.1)) return '맞음';
  return (a>0?'↑ ':'↓ ') + fmt(Math.abs(a),2) + ' · ' + turnsText(a, L.pitch);
}
function levelDiagram(u, res){
  var L = ensureLev(u), xs = levX(u);
  var x0 = 40, x1 = 320, y0 = 46, y1 = 126, sc = (x1-x0)/u.L;
  var s = '<svg class="dia" viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">';
  s += '<rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>';
  s += '<text x="'+(x0+4)+'" y="'+((y0+y1)/2+4)+'" font-size="11" fill="#6b7280">HP</text><text x="'+(x1-4)+'" y="'+((y0+y1)/2+4)+'" font-size="11" fill="#6b7280" text-anchor="end">OP</text>';
  s += '<text x="'+((x0+x1)/2)+'" y="'+(y0-28)+'" font-size="11" text-anchor="middle" fill="#6b7280">뒤 (D – C)</text><text x="'+((x0+x1)/2)+'" y="'+(y1+44)+'" font-size="11" text-anchor="middle" fill="#6b7280">앞 (A – B, 포트측)</text>';
  for(var i=0;i<L.n;i++){
    ['R','F'].forEach(function(sd){
      var k = sd+i, cx = x0 + xs[i]*sc, cy = sd==='F' ? y1 : y0;
      var a = res && res.adj[k] !== undefined ? res.adj[k] : null;
      var col = a === null ? '#d1d5db' : Math.abs(a) <= L.tolFlat/2 ? '#16a34a' : Math.abs(a) <= L.tolFlat ? '#d97706' : '#dc2626';
      s += '<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="'+col+'" stroke="#fff" stroke-width="2"/>';
      s += '<text x="'+cx+'" y="'+(cy+4)+'" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">'+(i+1)+'</text>';
      if(a !== null) s += '<text x="'+cx+'" y="'+(sd==='F'? cy+24 : cy-14)+'" font-size="11" font-weight="700" text-anchor="middle" fill="'+(Math.abs(a)<=Math.max(0.005,L.tolFlat*0.1)?'#15803d':a>0?'#1d4ed8':'#b45309')+'">'+(Math.abs(a)<=Math.max(0.005,L.tolFlat*0.1)?'OK':(a>0?'↑':'↓')+fmt(Math.abs(a),2))+'</text>';
    });
  }
  return s + '</svg>';
}
function levelOrder(u, res){
  var L = ensureLev(u), n = L.n, thr = Math.max(0.005, L.tolFlat*0.1);
  var corners = ['F0','F'+(n-1),'R0','R'+(n-1)].filter(function(k, i, a){ return a.indexOf(k) === i; });

  h += '<details style="margin-top:12px"'+(L.cfgOpen?' open':'')+'><summary style="font-weight:700">레벨링 설정 (발 개수·위치·피치·허용값)</summary><div class="grid2" style="margin-top:8px">';
  h += '<div><label>한쪽 발 개수</label><input type="number" min="2" max="12" data-lv="n" value="'+L.n+'"></div>';
  h += '<div><label>볼트 피치 mm/회전</label><input type="number" step="any" data-lv="pitch" value="'+L.pitch+'"></div>';
  h += '<div><label>평탄도 허용 mm</label><input type="number" step="any" data-lv="tolFlat" value="'+L.tolFlat+'"></div>';
  h += '<div><label>기울기 허용 mm/m</label><input type="number" step="any" data-lv="tolTilt" value="'+L.tolTilt+'"></div>';
  h += '</div><div class="f"><label>발 위치 (A에서 mm, 쉼표로 '+L.n+'개 · 비우면 균등)</label><input data-lv="xs" value="'+esc(L.xs)+'" placeholder="'+levX(u).map(function(x){return Math.round(x);}).join(', ')+'"></div>';
  h += '<div class="muted" style="margin-top:6px">피치 예: M16 = 2, M20 = 2.5, M24 = 3. 허용값은 임시 기본값이니 설비 사양으로 바꾸세요.</div></details>';

function levSummary(u){
  var last = levLast(u);

  var n = u.lev.rounds.filter(function(r){ return levCalc(u, r); }).length;

    + '<div class="muted">락너트 체결 '+(u.checks.lk1?'✓':'—')+' · 체결 후 재측정 '+(u.checks.lk2?'✓':'—')+'</div>';

function roundsTable(u){
  var L = ensureLev(u), h = '<table><tr><th>회차</th><th>측정</th><th>평탄도</th><th>길이</th><th>폭</th><th>판정</th></tr>';
  L.rounds.forEach(function(r, i){
    var x = levCalc(u, r);

  });

}
function levResultHtml(u, res){
  var L = ensureLev(u);
  if(!res) return '<div class="banner warn">발 높이를 입력하면 조정량을 계산합니다.</div>';
  var h = '<div class="kpi"><div class="'+(res.flatOk?'ok':'ng')+'"><b>'+fmt(res.flat,2)+'</b><span>평탄도 mm (≤'+L.tolFlat+')</span></div>';

  if(res.tx !== undefined) h += '<div class="muted" style="margin-top:6px">'+tiltText(res)+'</div>';
  if(res.count < res.total) h += '<div class="banner warn">'+res.count+'/'+res.total+'개 측정됨 — 나머지 발도 입력하세요.</div>';

  if(res.count === res.total && !res.ok) h += levelOrder(u, res);

function buildRows(){
  var rows = [['호기','일정','항목','기준(mm)','1차(mm)','2차(mm)','실측(mm)','편차(mm)','판정']];
  state.units.forEach(function(u){
    steps(u).forEach(function(st){
      (st.fields||[]).forEach(function(f){
        var r = fieldResult(u, f);
        rows.push([u.name, u.sched, f.label, fmtRaw(num(f.target)), fmtRaw(r.a1), fmtRaw(r.a2), fmtRaw(r.v), r.dev!==undefined?fmtRaw(r.dev):'', r.st==='ok'?'OK':r.st==='ng'?'NG':r.st==='info'?'기록':'']);
      });
    });
    var d = diagResult(u);
    rows.push([u.name, u.sched, '대각선 차이', '≤'+state.settings.tolDiag, '', '', d?fmtRaw(Math.abs(d.diff)):'', '', d?(d.ok?'OK':'NG'):'']);
    rows.push([u.name, u.sched, '완료/작업자/확인자', '', '', '', u.done||'', u.worker||state.settings.worker||'', u.checker||'']);
    if(u.lev){
      u.lev.rounds.forEach(function(rd, i){
        var x = levCalc(u, rd); if(!x) return;
        levKeys(u).forEach(function(k){
          if(x.adj[k] === undefined) return;
          rows.push([u.name, u.sched, '레벨링 '+(i+1)+'회차 '+footName(k), '', String(rd.v[k]), '', '', String(Math.round(x.adj[k]*100)/100), x.adj[k]>0?'올림':x.adj[k]<0?'내림':'맞음']);
        });
        rows.push([u.name, u.sched, '레벨링 '+(i+1)+'회차 평탄도/길이/폭 기울기', '≤'+u.lev.tolFlat, String(Math.round(x.flat*100)/100), x.tx===undefined?'':String(Math.round(x.tx*1000)/1000), x.ty===undefined?'':String(Math.round(x.ty*1000)/1000), '', x.ok?'OK':'NG']);
      });
    }
  });
  return rows;
}
function fmtRaw(n){ return n===null||n===undefined||!isFinite(n) ? '' : String(Math.round(n*10)/10); }
function buildText(){ return buildRows().map(function(r){ return r.join('\t'); }).join('\n'); }
function saveCsv(){
  var csv = '﻿' + buildRows().map(function(r){ return r.map(function(c){ c = String(c); return /[",\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(','); }).join('\r\n');
  var d = new Date(), name = '라인마킹_기록_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.csv';
  if(!(window.claude && window.claude.use)){ blobDownload(name, csv); return; }
  var p = window.claude.use('downloads');
  p.then(function(dl){
    if(!dl){ copyText(buildText()); toast('파일 저장을 쓸 수 없어 텍스트로 복사했습니다'); return; }
    return dl.save({filename:name, data:csv}).then(function(){ toast('CSV 저장'); }, function(){ toast('저장이 취소되었습니다'); });
  }).catch(function(){ copyText(buildText()); });
}
function blobDownload(name, data){
  try{
    var type = /\.html$/.test(name) ? 'text/html;charset=utf-8' : 'text/csv;charset=utf-8';
    var url = URL.createObjectURL(new Blob([data], {type:type}));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('저장했습니다');
  }catch(e){ toast('저장에 실패했습니다'); }
}
function copyText(s){
  try{ navigator.clipboard.writeText(s).then(function(){ toast('복사했습니다. 엑셀·카톡에 붙여넣기'); }, function(){ toast('복사가 막혔습니다'); }); }
  catch(e){ toast('복사가 막혔습니다'); }
}

function saveFile(name, data, fallbackText){
  if(!(window.claude && window.claude.use)){ blobDownload(name, data); return; }
  var p = window.claude.use('downloads');
  p.then(function(dl){
    if(!dl){ copyText(fallbackText); toast('파일 저장을 쓸 수 없어 텍스트로 복사했습니다'); return; }
    return dl.save({filename:name, data:data}).then(function(){ toast('저장했습니다'); }, function(){ toast('저장이 취소되었습니다'); });
  }).catch(function(){ copyText(fallbackText); });
}

  if(t.dataset.ptdel){ E.parts = E.parts.filter(function(p){ return p.id !== t.dataset.ptdel; }); save(); estRefresh(); return; }
  if(t.dataset.pdel){ E.procs = E.procs.filter(function(p){ return p.id !== t.dataset.pdel; }); save(); estRefresh(); return; }
  if(t.dataset.ldel){ E.logs = E.logs.filter(function(l){ return l.id !== t.dataset.ldel; }); save(); estRefresh(); return; }
  if(t.dataset.xdel){ E.exps = E.exps.filter(function(x){ return x.id !== t.dataset.xdel; }); save(); estRefresh(); return; }
  if(t.id === 'procAdd'){ E.procs.push({id:uid(), name:'', perUnit:true, grade:E.grades[0].id, men:null, hours:null, na:false, std:false}); save(); estRefresh(); return; }
  if(t.id === 'gradeAdd'){ E.grades.push({id:uid(), name:'직종'+(E.grades.length+1), rate:null}); save(); estRefresh(); return; }
  if(t.id === 'expAdd'){ E.exps.push({id:uid(), name:'', amt:null, na:false, std:false}); save(); estRefresh(); return; }
  if(t.id === 'logAdd'){
    var d = E.draft || {};
    if(!d.proc || num(d.men) === null || num(d.hours) === null){ toast('작업·인원·시간을 입력하세요'); return; }
    E.logs.push({id:uid(), date:d.date, proc:d.proc, unit:d.unit||'', men:num(d.men), hours:num(d.hours), ot:+d.ot||0, memo:d.memo||''});
    E.draft = {date:d.date, proc:d.proc, unit:d.unit, men:d.men, hours:null, ot:0, memo:''};
    save(); estRefresh(); toast('실적 추가'); return;
  }
  if(t.id === 'partsCsv'){ saveFile('파츠리스트_'+stamp()+'.csv', toCsv(partRows(E)), toTsv(partRows(E))); return; }
  if(t.id === 'partsCopy'){ copyText(toTsv(partRows(E))); return; }
  if(t.id === 'quoteSave'){ saveFile('견적서_'+(E.project.name||'공사')+'_'+stamp()+'.html', quoteFile(E), toTsv(quoteRows(E))); return; }
  if(t.id === 'quoteCsv'){ saveFile('견적서_'+stamp()+'.csv', toCsv(quoteRows(E)), toTsv(quoteRows(E))); return; }
  if(t.id === 'quoteCopy'){ copyText(toTsv(quoteRows(E))); return; }
});
function estLive(){
  var E = ensureEst(), T = totals(E), miss = missingList(E);
  var k = document.querySelectorAll('.kpi div b');
  if(k.length >= 3){ k[0].textContent = fmt(T.md,1); k[1].textContent = won(T.total/10000); k[2].textContent = miss.length; k[2].parentNode.className = miss.length?'ng':'ok'; }
  var q = document.getElementById('quoteDoc'); if(q) q.innerHTML = quoteHtml(E, T);
  var mt = document.getElementById('matTotal'); if(mt) mt.textContent = '자재비 합계 (체결 자재 + 기타) '+won(T.mat)+' 원';
}
main.addEventListener('input', function(e){
  if(state.tab !== 'est') return;
  var E = ensureEst(), t = e.target, d = t.dataset;
  if(d.ep){ E.project[d.ep] = t.value; }
  else if(d.pp){ var p = findById(E.procs, d.pp); if(!p) return; p[d.pk] = (d.pk==='name'||d.pk==='grade') ? t.value : num(t.value);
    var pl = document.getElementById('pl-'+p.id); if(pl){ var plan = procPlanMH(E, p), act = procActual(E, p); pl.innerHTML = '계획 '+(plan===null?'—':fmt(plan,1)+' MH')+' · 실적 '+(act?fmt(act.mh,1)+' MH':'—')+(plan!==null&&act?' · <b style="color:'+(act.mh>plan?'var(--ng)':'var(--ok)')+'">'+sgn(act.mh-plan)+'</b>':''); } }
  else if(d.gg){ var g = findById(E.grades, d.gg); if(!g) return; g[d.gk] = d.gk==='name' ? t.value : num(t.value); }
  else if(d.ehpd){ var v = num(t.value); if(v && v > 0) E.hpd = v; }
  else if(d.ld){ var dr = E.draft || (E.draft = {}); dr[d.ld] = (d.ld==='men'||d.ld==='hours') ? num(t.value) : t.value; save(); return; }
  else if(d.pt){ var pt = findById(E.parts, d.pt); if(!pt) return; pt[d.tk] = (d.tk==='qty'||d.tk==='spare'||d.tk==='price') ? num(t.value) : t.value;
    var el = document.getElementById('pq-'+pt.id), q = partQty(pt); if(el) el.textContent = '총 '+(q===null?'—':fmt(q,0)+' '+(pt.unit||'EA'))+' · '+won(partAmt(pt))+' 원'; }
  else if(d.xx){ var x = findById(E.exps, d.xx); if(!x) return; x[d.xk] = d.xk==='name' ? t.value : num(t.value); }
  else if(d.er){ E[d.er] = num(t.value); }
  else if(d.cc){ var c = findById(E.comps, d.cc); if(!c) return; c[d.ck] = d.ck==='name' ? t.value : num(t.value); compLive(E, c); }
  else if(d.ci){
    var pr = d.ci.split('|'), c2 = findById(E.comps, pr[0]); if(!c2) return; var it = findById(c2.items, pr[1]); if(!it) return;
    if(d.ik === 'qty'){ it.qty = num(t.value); if(it.grp && !isBolt(it.kind)) it.follow = false; }
    else { it[d.ik] = t.value; if(d.ik === 'spec' && it.grp && !isBolt(it.kind)) it.follow = false; }
    if(it.grp && isBolt(it.kind) && (d.ik === 'qty' || d.ik === 'spec')){
      c2.items.forEach(function(o){ if(o.grp === it.grp && o !== it && o.follow){ o.qty = it.qty; o.spec = sizeOf(it.spec); var qe = document.getElementById('qt-'+o.id), se = document.getElementById('sp-'+o.id); if(qe) qe.value = o.qty===null?'':o.qty; if(se) se.value = o.spec; } });
    }
    compLive(E, c2);
  }
  else if(d.pr !== undefined){ E.prices[d.pr] = num(t.value); var tr = t.closest('tr'), b = bom(E).filter(function(x){ return x.key === d.pr; })[0]; if(tr && b){ tr.cells[3].textContent = won(b.amt); var sm = 0; bom(E).forEach(function(x){ if(x.amt) sm += x.amt; }); var lt = tr.parentNode.lastElementChild; if(lt) lt.cells[3].textContent = won(sm); } }
  else if(d.fspare){ E.fSpare = num(t.value); var bb = document.getElementById('bomBox'); if(bb) bb.innerHTML = bomTable(E); }
  else return;
  save(); estLive();
});
main.addEventListener('change', function(e){
  if(state.tab !== 'est') return;
  var E = ensureEst(), t = e.target, d = t.dataset;
  if(d.pna){ var p = findById(E.procs, d.pna); if(p){ p.na = t.checked; save(); estRefresh(); } return; }
  if(d.pper){ var p2 = findById(E.procs, d.pper); if(p2){ p2.perUnit = t.checked; save(); estRefresh(); } return; }
  if(d.xna){ var x = findById(E.exps, d.xna); if(x){ x.na = t.checked; save(); estRefresh(); } return; }
  if(d.cper){ var cpu = findById(E.comps, d.cper); if(cpu){ cpu.perUnit = t.checked; save(); estRefresh(); } return; }
  if(d.ptper){ var pt = findById(E.parts, d.ptper); if(pt){ pt.perUnit = t.checked; save(); estRefresh(); } return; }
});


/* 테스트용 노출 */
window.__lm = {diag:diag, corr:corr, fieldResult:fieldResult, totals:function(){ return totals(ensureEst()); }, missing:function(){ return missingList(ensureEst()); }, state:function(){ return state; }};

render();
initCloud();
})();
